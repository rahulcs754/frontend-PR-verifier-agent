# Dogfooding: PreviewPilot checks this repo's own demo app (examples/demo-app)
# whenever Vercel reports a ready preview. deployment_status workflows run from
# the default branch, so this starts working once it is merged to main.
name: PreviewPilot

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write
  deployments: read

concurrency:
  group: preview-pilot-${{ github.event.deployment.sha }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment_url != '' &&
      !contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      # The checker itself always comes from main, so a PR can't change how it is judged.
      - uses: actions/checkout@v4
        with:
          ref: main
          path: .preview-pilot

      - name: Find production URL
        id: base
        uses: actions/github-script@v7
        env:
          CONFIGURED: ${{ vars.PR_VERIFY_BASE_URL }}
        with:
          script: |
            if (process.env.CONFIGURED) return core.setOutput('url', process.env.CONFIGURED);
            const { owner, repo } = context.repo;
            const { data: deployments } = await github.rest.repos.listDeployments({ owner, repo, environment: 'Production', per_page: 10 });
            for (const d of deployments) {
              const { data: statuses } = await github.rest.repos.listDeploymentStatuses({ owner, repo, deployment_id: d.id, per_page: 1 });
              if (statuses[0]?.state === 'success' && statuses[0].environment_url) {
                return core.setOutput('url', statuses[0].environment_url);
              }
            }
            core.setFailed('No production deployment found. Set the PR_VERIFY_BASE_URL repo variable.');

      - uses: ./.preview-pilot
        with:
          base-url: ${{ steps.base.outputs.url }}
          preview-url: ${{ github.event.deployment_status.environment_url }}
          routes: /,/pricing
          vercel-bypass-secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

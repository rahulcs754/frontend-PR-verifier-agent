name: PreviewPilot PR verify
description: Open the preview deploy and production in a real browser, find UI that broke, and post one PR comment.
branding:
  icon: eye
  color: blue

inputs:
  base-url:
    description: Production (or main branch) URL
    required: true
  preview-url:
    description: Preview deploy URL
    required: true
  routes:
    description: Comma-separated paths, e.g. "/,/pricing"
    required: false
    default: /
  config:
    description: Path to a pr-verify JSON config file in your repo
    required: false
    default: ''
  strict:
    description: Fail the check on warnings too
    required: false
    default: 'false'
  pr-number:
    description: PR to comment on. Found from the commit when empty.
    required: false
    default: ''
  comment:
    description: Create or update the PR comment
    required: false
    default: 'true'
  vercel-bypass-secret:
    description: Vercel "Protection Bypass for Automation" secret, if previews are protected
    required: false
    default: ''
  anthropic-api-key:
    description: Claude API key. When set, Claude reviews the screenshots and writes a short summary in the comment.
    required: false
    default: ''
  ai-model:
    description: Claude model for the review
    required: false
    default: ''
  github-token:
    description: Token used to post the comment
    required: false
    default: ${{ github.token }}

outputs:
  status:
    description: pass, warn or fail
    value: ${{ steps.run.outputs.status }}
  report-path:
    description: Folder with report.md, report.json and images
    value: ${{ steps.run.outputs.out }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install pr-verify
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm ci --no-audit --no-fund
        npx playwright install --with-deps chromium
        npm run build

    - name: Run pr-verify
      id: run
      shell: bash
      env:
        BASE_URL: ${{ inputs.base-url }}
        PREVIEW_URL: ${{ inputs.preview-url }}
        ROUTES: ${{ inputs.routes }}
        CONFIG: ${{ inputs.config }}
        STRICT: ${{ inputs.strict }}
        VERCEL_AUTOMATION_BYPASS_SECRET: ${{ inputs.vercel-bypass-secret }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        AI_MODEL: ${{ inputs.ai-model }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        CLI: ${{ github.action_path }}/dist/cli.js
      run: |
        out="$RUNNER_TEMP/pr-verify-report"
        args=(--base "$BASE_URL" --preview "$PREVIEW_URL" --out "$out" --artifact-url "$RUN_URL")
        # A config file can hold the routes, so only pass --routes when there is no config.
        if [ -n "$CONFIG" ]; then args+=(--config "$CONFIG"); else args+=(--routes "$ROUTES"); fi
        if [ "$STRICT" = "true" ]; then args+=(--strict); fi
        if [ -n "$AI_MODEL" ]; then args+=(--ai-model "$AI_MODEL"); fi
        set +e
        node "$CLI" "${args[@]}"
        code=$?
        set -e
        echo "out=$out" >> "$GITHUB_OUTPUT"
        echo "code=$code" >> "$GITHUB_OUTPUT"
        if [ -f "$out/report.json" ]; then
          echo "status=$(node -p "require('$out/report.json').summary.status")" >> "$GITHUB_OUTPUT"
          cat "$out/report.md" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Upload screenshots
      if: always() && steps.run.outputs.out != ''
      uses: actions/upload-artifact@v4
      with:
        name: pr-verify-report
        path: ${{ steps.run.outputs.out }}
        if-no-files-found: ignore

    - name: Comment on PR
      if: always() && inputs.comment == 'true' && steps.run.outputs.status != ''
      uses: actions/github-script@v7
      env:
        REPORT: ${{ steps.run.outputs.out }}/report.md
        PR_NUMBER: ${{ inputs.pr-number }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('node:fs');
          const marker = '<!-- pr-verify-report -->';
          const body = fs.readFileSync(process.env.REPORT, 'utf8');
          const { owner, repo } = context.repo;

          let issue_number = Number(process.env.PR_NUMBER) || context.payload.pull_request?.number;
          if (!issue_number) {
            // deployment_status events carry a commit, not a PR.
            const sha = context.payload.deployment?.sha ?? context.sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({ owner, repo, commit_sha: sha });
            issue_number = prs.find((p) => p.state === 'open')?.number;
          }
          if (!issue_number) {
            core.info('No open PR for this commit, skipping the comment.');
            return;
          }

          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find((c) => c.body?.startsWith(marker));
          if (mine) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            core.info(`Updated comment ${mine.html_url}`);
          } else {
            const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
            core.info(`Created comment ${data.html_url}`);
          }

    - name: Set check result
      if: always()
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.code }}
      run: |
        if [ "$CODE" != "0" ]; then
          echo "::error::pr-verify found breaking issues (exit $CODE). See the PR comment."
          exit 1
        fi
